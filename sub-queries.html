<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Sub-queries</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div class="content-wrap">
      <div id="title-bar"></div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-spacer"></span>
        <span id="grounding-switch-mount"></span>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">Sub-queries</h2>
            <p class="card-sub">Expanded searches AI engines issue while researching a prompt</p>
          </div>
        </div>
        <div id="table-mount"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('sub-queries.html');
  renderTitleBar(document.getElementById('title-bar'), 'Analytics', 'Sub-queries', 'Expanded searches AI engines may issue while researching a prompt topic');

  let groundingOn = true;
  buildSwitch(document.getElementById('grounding-switch-mount'), 'Search grounding', true, (v) => { groundingOn = v; render(); });

  const mount = document.getElementById('table-mount');
  function render() {
    if (!groundingOn) {
      mount.innerHTML = '<div class="empty-state">Search grounding is off — sub-queries are only shown for grounded (web-search-enabled) runs.</div>';
      return;
    }
    mount.innerHTML = '<div class="empty-state">Not tracked yet — track.py does not currently capture the intermediate search-grounding queries an engine issues. Hook this up once a platform API exposes them.</div>';
  }
  render();
}
init();
</script>
</body>
</html>
