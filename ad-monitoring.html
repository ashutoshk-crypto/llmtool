<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Ad Monitoring</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div class="content-wrap">
      <div id="title-bar"></div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-spacer"></span>
        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search advertisers...">
        </div>
      </div>

      <div class="metric-strip" id="metric-strip"></div>

      <div class="card">
        <div class="card-head"><div><h2 class="card-title">Prompts showing ads</h2><p class="card-sub">Sponsored results appearing inside tracked AI answers</p></div></div>
        <div id="ads-table"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('ad-monitoring.html');
  renderTitleBar(document.getElementById('title-bar'), 'Analytics', 'Ad monitoring', 'Sponsored results surfacing inside AI answer engines');

  document.getElementById('metric-strip').innerHTML = [
    { label: 'Prompts with ads', value: '0' },
    { label: 'Total advertisers', value: '0' },
    { label: 'Avg advertisers / prompt', value: '0' },
  ].map(m => `
    <div class="metric-cell">
      <div class="metric-label">${esc(m.label)}</div>
      <div class="metric-value mono">${esc(m.value)}</div>
    </div>
  `).join('');

  renderPaginatedTable(document.getElementById('ads-table'), {
    rows: [],
    emptyMessage: 'Not tracked yet — track.py captures the AI answer text but not sponsored/ad placements, since ChatGPT, Gemini, and Google AI Overview don\'t expose that in their response payloads. Wire this up once a platform surfaces ad data.',
    columns: [
      { label: 'Prompt', render: r => r.prompt },
      { label: 'Topic', render: r => r.category },
      { label: 'Platform', render: r => r.platform },
      { label: 'Advertisers', render: r => r.advertisers },
    ],
  });
}
init();
</script>
</body>
</html>
