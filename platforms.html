<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Platforms</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mentions by platform</h1>
    <p id="meta-line">Loading results...</p>
  </header>

  <div class="panel">
    <h2>Mentions by platform</h2>
    <p class="panel-sub">How often each brand came up, broken down by platform</p>
    <div class="legend" id="legend"></div>
    <div class="platform-grid" id="platform-grid"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('platforms.html');
  const data = await loadData();
  const { competitors, platforms, runs } = data;
  setMetaLine(data);

  if (!runs.length) {
    document.getElementById('platform-grid').innerHTML = '<p class="empty-state">No data yet.</p>';
    return;
  }

  document.getElementById('legend').innerHTML = competitors.map(c => `
    <div class="legend-item">
      <span class="legend-dot" style="background:${colorForBrand(c, competitors)}"></span>
      ${esc(c)}
    </div>
  `).join('');

  const platformGrid = document.getElementById('platform-grid');
  platformGrid.innerHTML = platforms.map(p => {
    const platRuns = runs.filter(r => r.platform === p);
    const counts = {};
    competitors.forEach(c => counts[c] = 0);
    platRuns.forEach(r => r.mentions.forEach(m => { if (counts[m] !== undefined) counts[m]++; }));
    const sorted = competitors.map(c => ({ name: c, count: counts[c] })).sort((a,b) => b.count - a.count);
    const max = Math.max(1, ...sorted.map(d => d.count));
    return `
      <div class="platform-card">
        <h3>${esc(p)} <span style="color:var(--text-muted); font-weight:400;">(${platRuns.length} responses)</span></h3>
        ${sorted.map(d => `
          <div class="mini-bar-row">
            <div class="name">${esc(d.name)}</div>
            <div class="mini-track"><div class="mini-fill" style="width:${(d.count/max)*100}%; background:${colorForBrand(d.name, competitors)};"></div></div>
            <div class="count">${d.count}</div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}
init();
</script>
</body>
</html>
