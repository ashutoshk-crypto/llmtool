<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Own-page tracking</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div class="content-wrap">
      <div id="title-bar"></div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-spacer"></span>
        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search URLs...">
        </div>
        <span id="suggested-switch-mount"></span>
        <button class="btn btn-primary" id="add-url-btn">+ Add URL</button>
      </div>

      <div class="metric-strip" id="metric-strip"></div>

      <div class="card">
        <div class="card-head"><div><h2 class="card-title">Tracked URLs</h2><p class="card-sub">coinswitch.co pages cited by AI answer engines, from real tracked citations</p></div></div>
        <div id="urls-table"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('own-pages.html');
  renderTitleBar(document.getElementById('title-bar'), 'Analytics', 'Own-page tracking', 'Monitor which CoinSwitch pages get cited or help drive brand mentions');

  const data = await loadData();
  const { runs } = data;

  function trackedPages() {
    const byUrl = {};
    runs.forEach(r => {
      (r.citations || []).filter(c => isOwnDomain(c.domain)).forEach(c => {
        if (!byUrl[c.url]) byUrl[c.url] = { url: c.url, citations: 0, coMentions: 0, addedByYou: false };
        byUrl[c.url].citations++;
        if (r.mentions.includes(OWN_BRAND)) byUrl[c.url].coMentions++;
      });
    });
    let extra = [];
    try { extra = JSON.parse(localStorage.getItem('own-pages-extra') || '[]'); } catch (e) { extra = []; }
    extra.forEach(e => {
      if (!byUrl[e.url]) byUrl[e.url] = { url: e.url, citations: 0, coMentions: 0, addedByYou: true };
    });
    return Object.values(byUrl);
  }

  const addBtn = document.getElementById('add-url-btn');
  let addedOnly = false;
  buildSwitch(document.getElementById('suggested-switch-mount'), 'Added by you', false, (v) => { addedOnly = v; render(); });

  const all = trackedPages();
  document.getElementById('metric-strip').innerHTML = [
    { label: 'Tracked pages', value: String(all.length) },
    { label: 'Total citations', value: String(all.reduce((n, p) => n + p.citations, 0)) },
    { label: 'Cited alongside a brand mention', value: String(all.reduce((n, p) => n + p.coMentions, 0)) },
  ].map(m => `
    <div class="metric-cell">
      <div class="metric-label">${esc(m.label)}</div>
      <div class="metric-value mono">${esc(m.value)}</div>
    </div>
  `).join('');

  function getFiltered() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let rows = trackedPages();
    if (addedOnly) rows = rows.filter(r => r.addedByYou);
    if (q) rows = rows.filter(r => r.url.toLowerCase().includes(q));
    return rows.sort((a, b) => b.citations - a.citations);
  }

  function render() {
    renderPaginatedTable(document.getElementById('urls-table'), {
      rows: getFiltered(),
      emptyMessage: 'No coinswitch.co citations tracked yet — run track.py, or add a URL to watch for it.',
      columns: [
        { label: 'URL', render: r => `<a class="cell-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url.replace('https://coinswitch.co',''))}</a>` },
        { label: 'Citations', num: true, render: r => String(r.citations) },
        { label: 'With brand mention', num: true, render: r => String(r.coMentions) },
        { label: 'Status', render: r => r.addedByYou && r.citations === 0 ? chip('Watching — not yet cited', 'neutral') : (r.addedByYou ? chip('Added by you', 'neutral') : '<span class="text-muted">--</span>') },
      ],
    });
  }

  document.getElementById('search').addEventListener('input', render);
  addBtn.addEventListener('click', () => {
    const url = window.prompt('Enter the own-page URL to track:');
    if (url && url.trim()) {
      let extra = [];
      try { extra = JSON.parse(localStorage.getItem('own-pages-extra') || '[]'); } catch (e) { extra = []; }
      extra.push({ url: url.trim() });
      localStorage.setItem('own-pages-extra', JSON.stringify(extra));
      render();
    }
  });
  showOnboardingTip(addBtn, 'own-pages-add', 'Track a CoinSwitch URL to watch for it in future AI answers.');

  render();
}
init();
</script>
</body>
</html>
