<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Citations</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div class="content-wrap">
      <div id="title-bar"></div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-spacer"></span>
        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search domains or pages...">
        </div>
        <button class="btn btn-ghost" id="export-btn">Export CSV</button>
      </div>

      <div class="content-grid">
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Top cited domains</h2><p class="card-sub">Ranked by citation count, extracted from real AI answers</p></div></div>
          <div id="domain-table"></div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Source type mix</h2></div></div>
          <div id="type-bars"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div><h2 class="card-title">Cited pages</h2><p class="card-sub">Every URL cited across tracked responses</p></div></div>
        <div id="pages-table"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('citations.html');
  renderTitleBar(document.getElementById('title-bar'), 'Analytics', 'Citations', 'Sources AI answer engines cite or reference when discussing tracked prompts');

  const data = await loadData();
  const { competitors, runs } = data;
  const sources = aggregateCitations(runs).map(s => ({
    ...s,
    sourceType: sourceTypeForDomain(s.domain),
    intent: [...new Set(runs.filter(r => (r.citations || []).some(c => c.url === s.url)).map(r => r.intent))].join(', '),
  }));
  const sourceTypes = [...new Set(sources.map(s => s.sourceType))].sort();

  const bar = document.getElementById('filter-bar');
  const spacer = bar.querySelector('.filter-spacer');
  const fSource = buildFilterPill(bar, 'type', 'All source types', sourceTypes);
  bar.insertBefore(fSource.closest('.filter-pill'), spacer);

  const byDomain = {};
  sources.forEach(s => {
    if (!byDomain[s.domain]) byDomain[s.domain] = { domain: s.domain, sourceType: s.sourceType, count: 0 };
    byDomain[s.domain].count += s.count;
  });
  const domains = Object.values(byDomain).sort((a, b) => b.count - a.count);

  renderPaginatedTable(document.getElementById('domain-table'), {
    rows: domains,
    pageSize: 10,
    emptyMessage: 'No citations tracked yet — run track.py to extract them from AI answers.',
    columns: [
      { label: 'Domain', render: d => `<span class="brand-pill">${brandInitialsHTML(d.domain, null)} ${esc(d.domain)}</span>` },
      { label: 'Type', render: d => sourceTypeChip(d.sourceType) },
      { label: 'Citations', num: true, render: d => String(d.count) },
    ],
  });

  const typeCounts = {};
  sources.forEach(s => { typeCounts[s.sourceType] = (typeCounts[s.sourceType] || 0) + s.count; });
  const maxType = Math.max(1, ...Object.values(typeCounts));
  document.getElementById('type-bars').innerHTML = Object.keys(typeCounts).length ? Object.entries(typeCounts).sort((a,b) => b[1]-a[1]).map(([t, c]) => `
    <div class="bar-row">
      <div class="name">${esc(t)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c/maxType)*100}%; background:var(--series-5);"></div></div>
      <div class="count">${c}</div>
    </div>
  `).join('') : '<div class="empty-state">No citations tracked yet.</div>';

  function getFiltered() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    return sources.filter(s =>
      (!fSource.value || s.sourceType === fSource.value) &&
      (!q || s.domain.toLowerCase().includes(q) || s.url.toLowerCase().includes(q))
    );
  }

  function render() {
    renderPaginatedTable(document.getElementById('pages-table'), {
      rows: getFiltered(),
      emptyMessage: 'No cited pages match these filters.',
      columns: [
        { label: 'Page', render: s => `<a class="cell-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url.replace('https://', ''))}</a>` },
        { label: 'Intent', render: s => s.intent ? intentChip(s.intent) : '<span class="text-muted">--</span>' },
        { label: 'Source', render: s => sourceTypeChip(s.sourceType) },
        { label: 'Prompts', num: true, render: s => String(s.prompts.length) },
        { label: 'Platforms', num: true, render: s => String(s.platforms.length) },
        { label: 'Citations', num: true, render: s => String(s.count) },
      ],
    });
  }
  fSource.addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('export-btn').addEventListener('click', () => {
    exportCSV('citations.csv', getFiltered(), [
      { label: 'URL', key: 'url' },
      { label: 'Domain', key: 'domain' },
      { label: 'Source type', key: 'sourceType' },
      { label: 'Citations', key: 'count' },
      { label: 'Prompts', key: r => r.prompts.length },
    ]);
  });
  render();
}
init();
</script>
</body>
</html>
