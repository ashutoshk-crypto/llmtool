<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Visibility Tracker — Overview</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Overview</h1>
    <p id="meta-line">Loading results...</p>
  </header>

  <div class="stat-row" id="stat-row"></div>

  <div class="panel">
    <h2>Share of voice by competitor</h2>
    <p class="panel-sub">Percent of AI responses that mentioned each brand, across all platforms and prompts</p>
    <div id="sov-chart"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
async function init() {
  renderNav('index.html');
  const data = await loadData();
  const { competitors, platforms, runs } = data;
  setMetaLine(data);

  const totalRuns = runs.length;
  const uniquePrompts = new Set(runs.map(r => r.prompt)).size;
  const runsWithMention = runs.filter(r => r.mentions.length > 0).length;
  const mentionRate = totalRuns ? Math.round((runsWithMention / totalRuns) * 100) : 0;

  const counts = brandCounts(competitors, runs);
  const topBrand = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];

  const statRow = document.getElementById('stat-row');
  const stats = [
    { label: 'Prompts analyzed', value: uniquePrompts, sub: totalRuns + ' total responses' },
    { label: 'Mention rate', value: mentionRate + '%', sub: 'responses naming any tracked brand' },
    { label: 'Top mentioned brand', value: topBrand ? topBrand[0] : '--', sub: topBrand ? topBrand[1] + ' mentions' : '' },
    { label: 'Platforms tracked', value: platforms.length, sub: platforms.join(', ') },
  ];
  statRow.innerHTML = stats.map(s => `
    <div class="stat-tile">
      <div class="label">${esc(s.label)}</div>
      <div class="value">${esc(String(s.value))}</div>
      <div class="sub">${esc(s.sub)}</div>
    </div>
  `).join('');

  if (!totalRuns) {
    document.getElementById('sov-chart').innerHTML = '<p class="empty-state">No data yet.</p>';
    return;
  }

  const sovData = competitors.map(c => ({
    name: c,
    count: counts[c] || 0,
    pct: totalRuns ? Math.round(((counts[c] || 0) / totalRuns) * 100) : 0,
  })).sort((a,b) => b.count - a.count);
  const maxPct = Math.max(1, ...sovData.map(d => d.pct));

  document.getElementById('sov-chart').innerHTML = sovData.map(d => `
    <div class="bar-row">
      <div class="name">${esc(d.name)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(d.pct / maxPct) * 100}%; background:${colorForBrand(d.name, competitors)};"></div>
      </div>
      <div class="count">${d.pct}% - ${d.count}</div>
    </div>
  `).join('');
}
init();
</script>
</body>
</html>
